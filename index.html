<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Website 11 RPL 2</title>
<link rel="icon" type="image/png" href="icon.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="spin" data-hari="">
<main class="max-w-6xl mx-auto p-4">
  <header class="flex flex-wrap items-center justify-between gap-2 mb-4">
    <h1 class="text-2xl font-bold">Kelas 11 RPL 2</h1>
    <nav id="nav" class="flex flex-wrap gap-2"></nav>
  </header>
  <section id="spin" class="grid lg:grid-cols-[minmax(0,1fr)_340px] gap-4">
    <div class="card flex flex-col items-center gap-4">
      <div id="tick" class="text-xl font-bold text-center min-h-[3.5rem] flex items-center justify-center">Siap diputar</div>
      <div id="wrap"><div id="ptr"></div><canvas id="wheel"></canvas><button id="hub" aria-label="Putar roda">SPIN</button></div>
      <button id="go" class="btn">PUTAR!</button>
      <label class="text-sm mu flex items-center gap-2">Tampilan roda:
        <select id="mode" style="background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:4px 8px">
          <option value="absen">Nomor absen</option><option value="nama">Nama depan</option>
        </select></label>
      <label class="text-sm mu flex items-center gap-2"><input type="checkbox" id="norep" checked> Jangan ulang yang sudah terpilih</label>
    </div>
    <div class="flex flex-col gap-4">
      <div class="card text-center">
        <div class="mu text-sm">Terpilih</div>
        <div id="num" class="text-6xl font-extrabold" style="color:var(--ac)">–</div>
        <div id="nm" class="text-xl font-semibold mt-1">Putar rodanya</div>
      </div>
      <div class="card">
        <div class="flex justify-between items-center mb-2">
          <b>Riwayat</b><button id="rst" class="btn2 text-sm">Reset</button>
        </div>
        <ol id="hist" class="text-sm space-y-1 max-h-56 overflow-y-auto"></ol>
        <div id="left" class="mu text-xs mt-2"></div>
      </div>
    </div>
  </section>
</main>
<script src="data.js"></script>
<script src="nav.js"></script>
<script src="spin.js"></script>
</body>
</html>
