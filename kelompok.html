<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Spin Kelompok – 11 RPL 2</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="kelompok" data-hari="">
<main class="max-w-6xl mx-auto p-4">
  <header class="flex flex-wrap items-center justify-between gap-2 mb-4">
    <h1 class="text-2xl font-bold">Kelas 11 RPL 2</h1>
    <nav id="nav" class="flex flex-wrap gap-2"></nav>
  </header>
  <section id="kel">
    <h2 class="text-2xl font-bold mb-2">Spin Kelompok</h2>
    <div class="card mb-3 flex flex-wrap items-center gap-4">
      <span class="font-semibold">Jumlah kelompok</span>
      <span class="flex items-center gap-2"><button class="btn2 st" id="kmin">−</button><b id="kn" class="w-8 text-center text-xl">5</b><button class="btn2 st" id="kplus">+</button></span>
      <button id="kgo" class="btn">SPIN KELOMPOK</button>
      <button id="kcopy" class="btn2">Salin hasil</button>
    </div>
    <details class="card mb-3"><summary class="cursor-pointer font-semibold">Siswa tidak hadir (<span id="kabs">0</span>)</summary>
      <div class="text-xs mu mt-2">Ketuk nama untuk menandai tidak hadir.</div>
      <div id="kchips" class="flex flex-wrap gap-2 mt-3"></div></details>
    <div id="kinfo" class="text-sm mu mb-3"></div>
    <div id="kres" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
  </section>
</main>
<script src="data.js"></script>
<script src="nav.js"></script>
<script src="kelompok.js"></script>
</body>
</html>
